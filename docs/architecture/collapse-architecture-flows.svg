<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
<title id="title">Collapse — потоки данных и владельцы состояния</title>
<desc id="desc">Три независимых сценария: durable outbox, история и окно сообщений, медиагалерея. Внизу указаны владельцы навигации, viewport, активности и локального поиска.</desc>
