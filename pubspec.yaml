name: collapse
description: "A small, offline-capable Tinode messenger."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  clock: ^1.1.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collapse_tinode:
    path: packages/tinode
  flutter_bloc: ^9.1.1
  go_router: 17.1.0
  flutter_web_plugins:
    sdk: flutter
  get_it: ^8.0.3
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  flutter_chat_ui: ^2.12.0
  flutter_chat_core: ^2.9.1
  flutter_list_view: 1.1.29
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  http: ^1.4.0
  collection: ^1.19.1
  crypto: ^3.0.7
  uuid: ^4.5.1
  mime: ^2.0.0
  file_picker: ^11.0.2
  image_picker: ^1.1.2
  record: ^6.2.1
  just_audio: ^0.10.5
  video_player: ^2.10.1
  extended_image: 10.1.0
  path_provider: ^2.1.5
  flutter_cache_manager: ^3.4.1
  url_launcher: ^6.3.1
  visibility_detector: ^0.4.0+2
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  just_audio_platform_interface: ^4.6.0
  video_player_platform_interface: ^6.9.0
  drift_dev: ^2.34.0
  sqlite3: ^3.5.2
  build_runner: ^2.7.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
